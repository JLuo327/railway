# =====================================================================
# Clash / mihomo / FlClash 订阅 —— Railway 单节点 VLESS+WS+TLS（国内分流）
# 更新：2026-11-05 05:5x CST（已按 Railway Free 方案精简为 1 个节点）
# 【当前剩余额度】$5.00（Trial，至 2026-12-05）→ 之后 Free 计划 $1/月
# 【试用剩余时间】约 30 天
# 【月成本估算】单节点固定 ≈ $0.60/月（内存 0.05GB×$10 + CPU 0.01×$20）
#                + 流量 $0.05/GB；Free 的 $1 额度约可覆盖 8GB/月流量
# 分流：GEOSITE,cn / GEOIP,CN → 国内直连；geolocation-!cn → 国外网站；其余 → 漏网之鱼
# =====================================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
  nameserver-policy:
    "geosite:cn,private":
      - "https://223.5.5.5/dns-query"
      - "https://doh.pub/dns-query"

proxies:
  - name: "Railway-美国-加州"
    type: vless
    server: railway-production-5618.up.railway.app
    port: 443
    uuid: 3eb905bc-a18a-4b40-8578-eeade9d4c67a
    udp: true
    tls: true
    servername: railway-production-5618.up.railway.app
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: "/tk-rail"
      headers:
        Host: railway-production-5618.up.railway.app

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "Railway-美国-加州"
      - DIRECT
  - name: "国内直连"
    type: select
    proxies:
      - DIRECT
      - "节点选择"
  - name: "国外网站"
    type: select
    proxies:
      - "节点选择"
      - DIRECT
  - name: "漏网之鱼"
    type: select
    proxies:
      - "节点选择"
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,cn,国内直连
  - GEOIP,CN,国内直连,no-resolve
  - GEOSITE,geolocation-!cn,国外网站
  - MATCH,漏网之鱼
