# =====================================================================
# Clash / mihomo / FlClash 订阅 —— ASCA + Railway（国内分流）
# 更新：2026-11-06 01:00 CST（ASCA-hy2 已在 VPS 删除，从订阅移除）
# 【Railway 额度】$5.00（Trial 至 2026-12-05）→ 之后 Free $1/月，固定 ≈$0.60/月 + 流量 $0.05/GB
# 【ASCA】ASCS Cloud · Onoway AB · 1 Gbps 对称光纤；纯 IPv6 出口，额度以 ASCS 面板为准
# 注意：Railway 服务已于 2026-11-05 删除（us.1983723.xyz 已无 DNS），该条目暂留作参数备份
# =====================================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
  nameserver-policy:
    "geosite:cn,private":
      - "https://223.5.5.5/dns-query"
      - "https://doh.pub/dns-query"

proxies:
  # VMess over TCP（明文，无 TLS；仅 IPv6 目标可达）
  - name: "ASCA-vmess"
    type: vmess
    server: "2600:70ff:b8c1:1::504"
    port: 18080
    uuid: "10ec2a11-4037-4581-a296-0dfd79aa3832"
    alterId: 0
    cipher: auto
    udp: true

  - name: "Railway-美国-加州"
    type: vless
    server: us.1983723.xyz
    port: 443
    uuid: 3eb905bc-a18a-4b40-8578-eeade9d4c67a
    udp: true
    tls: true
    servername: us.1983723.xyz
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: "/tk-rail"
      headers:
        Host: us.1983723.xyz

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "ASCA-vmess"
      - "Railway-美国-加州"
      - DIRECT
  - name: "国内直连"
    type: select
    proxies:
      - DIRECT
      - "节点选择"
  - name: "国外网站"
    type: select
    proxies:
      - "节点选择"
      - DIRECT
  - name: "漏网之鱼"
    type: select
    proxies:
      - "节点选择"
      - DIRECT

rules:
  # 私网直连用 CIDR 写死：GEOIP,private 依赖 geodata 里有 private 伪码，
  # 不同版本/不同下载源的 GeoIP.dat 未必带，会整份配置 check failed
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,国内直连
  - GEOIP,CN,国内直连,no-resolve
  - GEOSITE,geolocation-!cn,国外网站
  - MATCH,漏网之鱼
