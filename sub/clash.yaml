# =====================================================================
# Clash / mihomo / FlClash 订阅 —— Railway 单服务双入口（国内分流）
# 更新：2026-11-05 06:3x CST
# 【当前剩余额度】$5.00（Trial，至 2026-12-05）→ 之后 Free 计划 $1/月
# 【月成本估算】单服务固定 ≈ $0.60/月 + 流量 $0.05/GB（Free 额度约 8GB/月）
# 两个节点是同一个服务：一个走 *.up.railway.app，一个走自定义域 us.1983723.xyz
# 前者被宽带干扰时切后者即可
# =====================================================================
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
  nameserver-policy:
    "geosite:cn,private":
      - "https://223.5.5.5/dns-query"
      - "https://doh.pub/dns-query"

proxies:
  - name: "Railway-美国-加州"
    type: vless
    server: railway-production-5618.up.railway.app
    port: 443
    uuid: 3eb905bc-a18a-4b40-8578-eeade9d4c67a
    udp: true
    tls: true
    servername: railway-production-5618.up.railway.app
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: "/tk-rail"
      headers:
        Host: railway-production-5618.up.railway.app
  - name: "Railway-美国-加州-自定义域名"
    type: vless
    server: us.1983723.xyz
    port: 443
    uuid: 3eb905bc-a18a-4b40-8578-eeade9d4c67a
    udp: true
    tls: true
    servername: us.1983723.xyz
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: "/tk-rail"
      headers:
        Host: us.1983723.xyz

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "Railway-美国-加州"
      - "Railway-美国-加州-自定义域名"
      - DIRECT
  - name: "国内直连"
    type: select
    proxies:
      - DIRECT
      - "节点选择"
  - name: "国外网站"
    type: select
    proxies:
      - "节点选择"
      - DIRECT
  - name: "漏网之鱼"
    type: select
    proxies:
      - "节点选择"
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,cn,国内直连
  - GEOIP,CN,国内直连,no-resolve
  - GEOSITE,geolocation-!cn,国外网站
  - MATCH,漏网之鱼
